version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tms_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: tms_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tms_db
      TMS_SEED_PASSWORD: ChangeMe@123
      NODE_ENV: production
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: tms_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
