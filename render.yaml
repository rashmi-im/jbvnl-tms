services:
  # 1. PostgreSQL Managed Database
  - type: postgres
    name: tms-postgres
    ipAllowList: [] # allow all internal connections
    plan: free
data:image/png;base64,
  # 2. FastAPI Backend Web Service
  - type: web
    name: tms-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tms-postgres
          property: connectionString
      - key: TMS_SEED_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production

  # 3. React Vite Frontend Static Site
  - type: web
    name: tms-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://tms-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
