databases:
  # Managed PostgreSQL Database on Render
  - name: tms-db
    databaseName: tms_db
    user: postgres
    plan: free

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: tms-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tms-db
          property: connectionString
      - key: TMS_SEED_PASSWORD
        value: ChangeMe@123
      - key: NODE_ENV
        value: production

  # 2. React + Vite Frontend Static Site
  - type: web
    name: tms-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tms-backend
          property: host


