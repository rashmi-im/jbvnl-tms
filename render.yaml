services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: tms-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TMS_SEED_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production

